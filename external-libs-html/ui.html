<!DOCTYPE html>
<html>
<head>
  <!-- Load external library via CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/nano.min.css">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 1rem;
      margin: 0;
      background: #1e1e1e;
      color: #fff;
    }

    h3 {
      margin: 0 0 0.5rem 0;
      font-size: 1.125rem;
      font-weight: 600;
      color: #00C1A2;
    }

    p {
      margin: 0 0 1rem 0;
      font-size: 0.8125rem;
      color: #888;
    }

    .info-box {
      background: #2a2a2a;
      border-radius: 0.5rem;
      padding: 0.75rem;
      margin-bottom: 1rem;
      font-size: 0.75rem;
      color: #888;
      line-height: 1.5;
    }

    .info-box code {
      background: #3a3a3a;
      padding: 0.125rem 0.375rem;
      border-radius: 0.25rem;
      font-family: monospace;
    }

    .picker-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .color-value {
      font-family: monospace;
      font-size: 0.875rem;
      color: #888;
    }

    button {
      background: #f5f5f5;
      color: #1e1e1e;
      border: none;
      padding: 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      background: #e8e8e8;
    }
  </style>
</head>
<body>
  <h3>External Libraries</h3>
  <p>Using a color picker library loaded via CDN.</p>

  <div class="info-box">
    This example uses <code>@simonwep/pickr</code> loaded from jsDelivr CDN.
    In HTML/JS plugins, you can include any library with a <code>&lt;script&gt;</code> tag.
  </div>

  <div class="picker-container">
    <div id="color-picker"></div>
    <div class="color-value" id="color-value">#4285f4</div>
  </div>

  <button id="create-shape">Create shape with color</button>

  <!-- Load Pickr library -->
  <script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>

  <script>
    let currentColor = '#4285f4';

    // Initialize the color picker library
    const pickr = Pickr.create({
      el: '#color-picker',
      theme: 'nano',
      default: currentColor,
      components: {
        preview: true,
        hue: true,
        interaction: {
          input: true
        }
      }
    });

    // Update when color changes
    pickr.on('change', (color) => {
      currentColor = color.toHEXA().toString();
      document.getElementById('color-value').textContent = currentColor;
    });

    // Auto-save when picker is hidden
    pickr.on('hide', () => {
      pickr.applyColor();
    });

    // Button handler
    document.getElementById('create-shape').addEventListener('click', () => {
      parent.postMessage({
        pluginMessage: {
          type: 'create-colored-shape',
          color: currentColor
        }
      }, '*');
    });
  </script>
</body>
</html>
