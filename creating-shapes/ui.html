<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      margin: 0;
      background: #1e1e1e;
      color: #fff;
    }

    h3 {
      margin: 0 0 8px 0;
      font-size: 18px;
      font-weight: 600;
      color: #00C1A2;
    }

    p {
      margin: 0 0 16px 0;
      font-size: 13px;
      color: #888;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      background: #f5f5f5;
      color: #1e1e1e;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
    }

    button:hover {
      background: #e8e8e8;
    }
  </style>
</head>
<body>
  <h3>Creating Shapes</h3>
  <p>Click a button to add a shape to the scene.</p>

  <div class="buttons">
    <button id="rectangle">Rectangle</button>
    <button id="ellipse">Ellipse</button>
    <button id="polygon">Polygon (Hexagon)</button>
    <button id="star">Star</button>
    <button id="path">Path (Heart)</button>
  </div>

  <script>
    const buttons = {
      'rectangle': 'create-rectangle',
      'ellipse': 'create-ellipse',
      'polygon': 'create-polygon',
      'star': 'create-star',
      'path': 'create-path'
    };

    Object.entries(buttons).forEach(([id, type]) => {
      document.getElementById(id).addEventListener('click', () => {
        parent.postMessage({ pluginMessage: { type } }, '*');
      });
    });
  </script>
</body>
</html>
