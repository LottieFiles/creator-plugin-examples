<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      margin: 0;
      background: #1e1e1e;
      color: #fff;
    }

    h3 {
      margin: 0 0 8px 0;
      font-size: 18px;
      font-weight: 600;
      color: #00C1A2;
    }

    p {
      margin: 0 0 16px 0;
      font-size: 13px;
      color: #888;
    }

    .info-box {
      background: #2a2a2a;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 12px;
      color: #888;
      line-height: 1.5;
    }

    .info-box code {
      background: #3a3a3a;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }

    button {
      background: #f5f5f5;
      color: #1e1e1e;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      background: #e8e8e8;
    }

    button:disabled {
      background: #3a3a3a;
      color: #666;
      cursor: not-allowed;
    }

    .status {
      margin-top: 16px;
      padding: 12px;
      background: #2a2a2a;
      border-radius: 8px;
      font-size: 13px;
      color: #888;
    }

    .status.success { color: #00C1A2; }
    .status.error { color: #ff6b6b; }
    .status.loading { color: #ffc107; }
  </style>
</head>
<body>
  <h3>Network Requests</h3>
  <p>Fetch data from an API and use it to create shapes.</p>

  <div class="info-box">
    <strong>How it works:</strong><br>
    Plugin code can't make network requests directly. The UI fetches data using <code>fetch()</code>, then sends it to the plugin via <code>postMessage</code>.
  </div>

  <button id="fetch-btn">Create shape layers with random Pokémon names</button>

  <div id="status" class="status">
    Click the button to fetch random Pokémon names
  </div>

  <script>
    const fetchBtn = document.getElementById('fetch-btn');
    const status = document.getElementById('status');

    fetchBtn.addEventListener('click', async () => {
      // Show loading state
      status.textContent = 'Fetching Pokémon...';
      status.className = 'status loading';
      fetchBtn.disabled = true;

      try {
        // Fetch random Pokemon by using a random offset
        const offset = Math.floor(Math.random() * 1000);
        const response = await fetch(`https://pokeapi.co/api/v2/pokemon?limit=3&offset=${offset}`);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        const names = data.results.map(p => p.name);

        // Send the names to the plugin
        parent.postMessage({
          pluginMessage: {
            type: 'create-layers',
            names: names
          }
        }, '*');

      } catch (error) {
        status.textContent = `Fetch failed: ${error.message}`;
        status.className = 'status error';
        fetchBtn.disabled = false;
      }
    });

    // Listen for messages from the plugin
    window.addEventListener('message', (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      fetchBtn.disabled = false;

      if (msg.type === 'success') {
        status.textContent = msg.message;
        status.className = 'status success';
      } else if (msg.type === 'error') {
        status.textContent = msg.message;
        status.className = 'status error';
      }
    });
  </script>
</body>
</html>
