<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      margin: 0;
      background: #1e1e1e;
      color: #fff;
    }

    h3 {
      margin: 0 0 8px 0;
      font-size: 18px;
      font-weight: 600;
      color: #00C1A2;
    }

    p {
      margin: 0 0 16px 0;
      font-size: 13px;
      color: #888;
    }

    .section {
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 500;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      background: #f5f5f5;
      color: #1e1e1e;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
    }

    button:hover {
      background: #e8e8e8;
    }

    button.danger {
      background: #ff6b6b;
      color: #fff;
    }

    button.danger:hover {
      background: #ff5252;
    }

    .status {
      margin-top: 16px;
      padding: 12px;
      background: #2a2a2a;
      border-radius: 8px;
      font-size: 13px;
      color: #888;
    }

    .status.error {
      color: #ff6b6b;
    }

    .keyframe-list {
      font-family: monospace;
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <h3>Updating Animation</h3>
  <p>Select a layer, then use these tools to inspect and modify its position property.</p>

  <div class="section">
    <div class="section-title">Read position keyframes</div>
    <div class="buttons">
      <button id="check">Check animation status</button>
      <button id="read">Read keyframe values</button>
    </div>
    </div>

    <div class="section"></div>
    <div class="section-title">Update position keyframes</div>
    <div class="buttons">
      <button id="update-static">Set static value (200, 200)</button>
      <button id="update-kf">Update keyframe at current frame</button>
    </div>
    </div>

    <div class="section"></div>
    <div class="section-title">Remove position keyframes</div>
    <div class="buttons">
      <button id="remove-kf">Remove keyframe at current frame</button>
      <button id="clear" class="danger">Clear all keyframes</button>
    </div>
    </div>

    <div id="status" class="status">
    Select a layer and click "Check animation status" to start
    </div>

  <script>
    const status = document.getElementById('status');

    function showStatus(message, isError = false) {
      status.textContent = message;
      status.className = isError ? 'status error' : 'status';
    }

    function showKeyframes(keyframes) {
      if (keyframes.length === 0) {
        showStatus('No keyframes found');
        return;
      }

      status.className = 'status';
      status.innerHTML = '<div class="keyframe-list">' +
        keyframes.map(kf => `Frame ${kf.frame}: (${kf.x}, ${kf.y})`).join('<br>') +
        '</div>';
    }

    document.getElementById('check').addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'check-animation' } }, '*');
    });

    document.getElementById('read').addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'read-keyframes' } }, '*');
    });

    document.getElementById('update-static').addEventListener('click', () => {
      parent.postMessage({
        pluginMessage: { type: 'update-static', value: { x: 200, y: 200 } }
      }, '*');
    });

    document.getElementById('update-kf').addEventListener('click', () => {
      parent.postMessage({
        pluginMessage: { type: 'update-keyframe', value: { x: 300, y: 100 } }
      }, '*');
    });

    document.getElementById('remove-kf').addEventListener('click', () => {
      parent.postMessage({
        pluginMessage: { type: 'remove-keyframe' }
      }, '*');
    });

    document.getElementById('clear').addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'clear-keyframes' } }, '*');
    });

    window.addEventListener('message', (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      switch (msg.type) {
        case 'status':
          showStatus(msg.message);
          break;
        case 'error':
          showStatus(msg.message, true);
          break;
        case 'keyframes':
          showKeyframes(msg.keyframes);
          break;
      }
    });
  </script>
</body>
</html>
