<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 1rem;
      margin: 0;
      background: #1e1e1e;
      color: #fff;
    }

    h3 {
      margin: 0 0 0.5rem 0;
      font-size: 1.125rem;
      font-weight: 600;
      color: #00C1A2;
    }

    p {
      margin: 0 0 1rem 0;
      font-size: 0.8125rem;
      color: #888;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    button {
      background: #f5f5f5;
      color: #1e1e1e;
      border: none;
      padding: 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
    }

    button:hover {
      background: #e8e8e8;
    }

    button .description {
      font-size: 0.75rem;
      color: #666;
      font-weight: 400;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>
  <h3>Animating Transforms</h3>
  <p>Create layers with different transform animations.</p>

  <div class="buttons">
    <button id="position">
      Position animation
      <div class="description">Move from left to right and back</div>
    </button>

    <button id="rotation">
      Rotation animation
      <div class="description">Full 360° spin</div>
    </button>

    <button id="scale">
      Scale animation
      <div class="description">Pulse effect (grow and shrink)</div>
    </button>

    <button id="opacity">
      Opacity animation
      <div class="description">Fade in and out</div>
    </button>

    <button id="combined">
      Combined animation
      <div class="description">All transforms together</div>
    </button>
  </div>

  <script>
    const actions = {
      'position': 'animate-position',
      'rotation': 'animate-rotation',
      'scale': 'animate-scale',
      'opacity': 'animate-opacity',
      'combined': 'animate-combined'
    };

    Object.entries(actions).forEach(([id, type]) => {
      document.getElementById(id).addEventListener('click', () => {
        parent.postMessage({ pluginMessage: { type } }, '*');
      });
    });
  </script>
</body>
</html>
