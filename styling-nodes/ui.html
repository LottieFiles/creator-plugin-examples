<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 1rem;
      margin: 0;
      background: #1e1e1e;
      color: #fff;
    }

    h3 {
      margin: 0 0 0.5rem 0;
      font-size: 1.125rem;
      font-weight: 600;
      color: #00C1A2;
    }

    p {
      margin: 0 0 1rem 0;
      font-size: 0.8125rem;
      color: #888;
    }

    .section {
      margin-bottom: 1rem;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 500;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.03125rem;
      margin-bottom: 0.5rem;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    button {
      background: #f5f5f5;
      color: #1e1e1e;
      border: none;
      padding: 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
    }

    button:hover {
      background: #e8e8e8;
    }
  </style>
</head>
<body>
  <h3>Styling Nodes</h3>
  <p>Add fills, gradients, and strokes to shapes.</p>

  <div class="section">
    <div class="section-title">Fills</div>
    <div class="buttons">
      <button id="solid">Solid color fill</button>
      <button id="linear">Linear gradient</button>
      <button id="radial">Radial gradient</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Strokes</div>
    <div class="buttons">
      <button id="stroke-solid">Solid stroke</button>
      <button id="stroke-dashed">Dashed stroke</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Combined</div>
    <div class="buttons">
      <button id="combined">Gradient fill + stroke</button>
    </div>
  </div>

  <script>
    const actions = {
      'solid': 'solid-fill',
      'linear': 'linear-gradient',
      'radial': 'radial-gradient',
      'stroke-solid': 'stroke-solid',
      'stroke-dashed': 'stroke-dashed',
      'combined': 'combined'
    };

    Object.entries(actions).forEach(([id, type]) => {
      document.getElementById(id).addEventListener('click', () => {
        parent.postMessage({ pluginMessage: { type } }, '*');
      });
    });
  </script>
</body>
</html>
