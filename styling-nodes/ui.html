<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      margin: 0;
      background: #1e1e1e;
      color: #fff;
    }

    h3 {
      margin: 0 0 8px 0;
      font-size: 18px;
      font-weight: 600;
      color: #00C1A2;
    }

    p {
      margin: 0 0 16px 0;
      font-size: 13px;
      color: #888;
    }

    .section {
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 500;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      background: #f5f5f5;
      color: #1e1e1e;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
    }

    button:hover {
      background: #e8e8e8;
    }
  </style>
</head>
<body>
  <h3>Styling Nodes</h3>
  <p>Add fills, gradients, and strokes to shapes.</p>

  <div class="section">
    <div class="section-title">Fills</div>
    <div class="buttons">
      <button id="solid">Solid Color Fill</button>
      <button id="linear">Linear Gradient</button>
      <button id="radial">Radial Gradient</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Strokes</div>
    <div class="buttons">
      <button id="stroke-solid">Solid Stroke</button>
      <button id="stroke-dashed">Dashed Stroke</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Combined</div>
    <div class="buttons">
      <button id="combined">Gradient Fill + Stroke</button>
    </div>
  </div>

  <script>
    const actions = {
      'solid': 'solid-fill',
      'linear': 'linear-gradient',
      'radial': 'radial-gradient',
      'stroke-solid': 'stroke-solid',
      'stroke-dashed': 'stroke-dashed',
      'combined': 'combined'
    };

    Object.entries(actions).forEach(([id, type]) => {
      document.getElementById(id).addEventListener('click', () => {
        parent.postMessage({ pluginMessage: { type } }, '*');
      });
    });
  </script>
</body>
</html>
