<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 1rem;
      margin: 0;
      background: #1e1e1e;
      color: #fff;
    }

    h3 {
      margin: 0 0 0.5rem 0;
      font-size: 1.125rem;
      font-weight: 600;
      color: #00C1A2;
    }

    p {
      margin: 0 0 1rem 0;
      font-size: 0.8125rem;
      color: #888;
    }

    .section {
      margin-bottom: 1rem;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 500;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.03125rem;
      margin-bottom: 0.5rem;
    }

    .input-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    input[type="text"] {
      flex: 1;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 0.625rem 0.75rem;
      border-radius: 0.375rem;
      font-size: 0.8125rem;
    }

    input[type="text"]::placeholder {
      color: #666;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #00C1A2;
    }

    textarea {
      width: 100%;
      min-height: 6.25rem;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 0.625rem 0.75rem;
      border-radius: 0.375rem;
      font-size: 0.75rem;
      font-family: monospace;
      resize: vertical;
      box-sizing: border-box;
      margin-bottom: 0.5rem;
    }

    textarea:focus {
      outline: none;
      border-color: #00C1A2;
    }

    button {
      background: #00C1A2;
      color: #fff;
      border: none;
      padding: 0.625rem 1rem;
      border-radius: 0.375rem;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover {
      background: #00a88d;
    }

    button.secondary {
      background: #444;
    }

    button.secondary:hover {
      background: #555;
    }

    .status {
      margin-top: 1rem;
      padding: 0.75rem;
      background: #2a2a2a;
      border-radius: 0.5rem;
      font-size: 0.8125rem;
      color: #888;
    }

    .status.success { color: #00C1A2; }
    .status.error { color: #ff6b6b; }

    label {
      display: block;
      font-size: 0.75rem;
      color: #aaa;
      margin-bottom: 0.25rem;
    }
  </style>
</head>
<body>
  <h3>Importing Assets</h3>
  <p>Import Lottie animations, SVGs, and images into the scene.</p>

  <div class="section">
    <div class="section-title">Lottie Animation</div>
    <div class="input-group">
      <input type="text" id="lottie-url" >
      <button id="import-lottie">Import</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">SVG from URL</div>
    <div class="input-group">
      <input type="text" id="svg-url" >
      <button id="import-svg">Import</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Image</div>
    <div class="input-group">
      <input type="text" id="image-url" value="https://picsum.photos/200/200">
      <button id="import-image">Import</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">SVG from Content</div>
    <textarea id="svg-content"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="40" fill="#4285f4"/>
  <circle cx="35" cy="40" r="8" fill="white"/>
  <circle cx="65" cy="40" r="8" fill="white"/>
  <path d="M 30 65 Q 50 80 70 65" stroke="white" stroke-width="4" fill="none"/>
</svg></textarea>
    <button id="import-svg-content">Import SVG Content</button>
  </div>

  <div id="status" class="status">
    Enter a URL or SVG content and click Import
  </div>

  <script>
    const status = document.getElementById('status');

    function showStatus(message, type = '') {
      status.textContent = message;
      status.className = 'status' + (type ? ' ' + type : '');
    }

    // Lottie import
    document.getElementById('import-lottie').addEventListener('click', () => {
      const url = document.getElementById('lottie-url').value.trim() ||
                  document.getElementById('lottie-url').placeholder;
      showStatus('Importing Lottie...');
      parent.postMessage({ pluginMessage: { type: 'import-lottie', url } }, '*');
    });

    // SVG from URL import
    document.getElementById('import-svg').addEventListener('click', () => {
      const url = document.getElementById('svg-url').value.trim() ||
                  document.getElementById('svg-url').placeholder;
      showStatus('Importing SVG...');
      parent.postMessage({ pluginMessage: { type: 'import-svg', url } }, '*');
    });

    // Image import
    document.getElementById('import-image').addEventListener('click', () => {
      const url = document.getElementById('image-url').value.trim() ||
                  document.getElementById('image-url').placeholder;
      showStatus('Importing image...');
      parent.postMessage({ pluginMessage: { type: 'import-image', url } }, '*');
    });

    // SVG content import
    document.getElementById('import-svg-content').addEventListener('click', () => {
      const content = document.getElementById('svg-content').value.trim();
      if (!content) {
        showStatus('Please enter SVG content', 'error');
        return;
      }
      showStatus('Importing SVG content...');
      parent.postMessage({ pluginMessage: { type: 'import-svg-content', content } }, '*');
    });

    // Listen for messages from the plugin
    window.addEventListener('message', (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'success') {
        showStatus(msg.message, 'success');
      } else if (msg.type === 'error') {
        showStatus(msg.message, 'error');
      }
    });
  </script>
</body>
</html>
