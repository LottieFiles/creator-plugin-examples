<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      margin: 0;
      background: #1e1e1e;
      color: #fff;
    }

    h3 {
      margin: 0 0 8px 0;
      font-size: 16px;
      font-weight: 600;
    }

    p {
      margin: 0 0 16px 0;
      font-size: 13px;
      color: #999;
      line-height: 1.5;
    }

    .section {
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    button {
      background: #333;
      color: white;
      border: 1px solid #444;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
    }

    button:hover {
      background: #444;
      border-color: #555;
    }

    .description {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
    }

    .status {
      margin-top: 16px;
      padding: 12px;
      background: #2a2a2a;
      border-radius: 6px;
      font-size: 13px;
      color: #999;
    }

    .status.success { color: #4caf50; }
    .status.error { color: #f44336; }
  </style>
</head>
<body>
  <h3>Importing Assets</h3>
  <p>Import Lottie animations, SVGs, and images into the scene.</p>

  <div class="section">
    <div class="section-title">From URL</div>
    <div class="buttons">
      <button id="import-lottie">
        Import Lottie Animation
        <div class="description">Sample animation from LottieFiles</div>
      </button>
      <button id="import-svg">
        Import SVG
        <div class="description">SVG logo from Wikipedia</div>
      </button>
      <button id="import-image">
        Import Image
        <div class="description">Random image from Picsum</div>
      </button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">From Content</div>
    <div class="buttons">
      <button id="import-svg-content">
        Import SVG from String
        <div class="description">Inline SVG content (smiley face)</div>
      </button>
    </div>
  </div>

  <div id="status" class="status">
    Click a button to import an asset
  </div>

  <script>
    const status = document.getElementById('status');

    const actions = {
      'import-lottie': 'import-lottie',
      'import-svg': 'import-svg',
      'import-image': 'import-image',
      'import-svg-content': 'import-svg-content'
    };

    Object.entries(actions).forEach(([id, type]) => {
      document.getElementById(id).addEventListener('click', () => {
        status.textContent = 'Importing...';
        status.className = 'status';
        parent.postMessage({ pluginMessage: { type } }, '*');
      });
    });

    // Listen for messages from the plugin
    window.addEventListener('message', (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'success') {
        status.textContent = msg.message;
        status.className = 'status success';
      } else if (msg.type === 'error') {
        status.textContent = msg.message;
        status.className = 'status error';
      }
    });
  </script>
</body>
</html>
