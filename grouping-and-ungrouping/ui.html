<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 1rem;
      margin: 0;
      background: #1e1e1e;
      color: #fff;
    }

    h3 {
      margin: 0 0 0.5rem 0;
      font-size: 1.125rem;
      font-weight: 600;
      color: #00C1A2;
    }

    p {
      margin: 0 0 1rem 0;
      font-size: 0.8125rem;
      color: #888;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    button {
      background: #f5f5f5;
      color: #1e1e1e;
      border: none;
      padding: 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
    }

    button:hover {
      background: #e8e8e8;
    }

    .status {
      margin-top: 1rem;
      padding: 0.75rem;
      background: #2a2a2a;
      border-radius: 0.5rem;
      font-size: 0.8125rem;
      color: #888;
    }
  </style>
</head>
<body>
  <h3>Grouping Shapes</h3>
  <p>Create individual container layers, or group shapes within a single container.</p>

  <div class="buttons">
    <button id="create">Create container layers</button>
    <button id="group">Group shapes in container</button>
  </div>

  <div id="status" class="status">
    Click a button to see grouping in action
  </div>

  <script>
    const status = document.getElementById('status');

    document.getElementById('create').addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'create-shapes' } }, '*');
    });

    document.getElementById('group').addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'group-shapes' } }, '*');
    });

    // Listen for messages from the plugin
    window.addEventListener('message', (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      switch (msg.type) {
        case 'shapes-created':
          status.textContent = 'Created 3 container layers with shapes';
          break;
        case 'grouped':
          status.textContent = msg.message || 'Shapes grouped in container';
          break;
        case 'error':
          status.textContent = msg.message;
          break;
      }
    });
  </script>
</body>
</html>
