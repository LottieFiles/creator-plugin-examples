<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      margin: 0;
      background: #1e1e1e;
      color: #fff;
    }

    h3 {
      margin: 0 0 8px 0;
      font-size: 18px;
      font-weight: 600;
      color: #00C1A2;
    }

    p {
      margin: 0 0 16px 0;
      font-size: 13px;
      color: #888;
    }

    .section {
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 500;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .section-desc {
      font-size: 12px;
      color: #666;
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    input {
      flex: 1;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 13px;
    }

    input::placeholder {
      color: #666;
    }

    input:focus {
      outline: none;
      border-color: #00C1A2;
    }

    button {
      background: #f5f5f5;
      color: #1e1e1e;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    button:hover {
      background: #e8e8e8;
    }

    .output {
      padding: 12px;
      background: #2a2a2a;
      border-radius: 8px;
      font-size: 13px;
      color: #888;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h3>Storing Data</h3>
  <p>Two ways to persist data: client storage (browser) and node data (file).</p>

  <div class="section">
    <div class="section-title">Client Storage</div>
    <div class="section-desc">Stored in browser, persists across sessions (5 MB limit)</div>

    <div class="row">
      <input type="text" id="client-key" placeholder="Key">
      <input type="text" id="client-value" placeholder="Value">
    </div>
    <div class="row">
      <button id="client-save">Save</button>
      <button id="client-load">Load</button>
      <button id="client-list">List Keys</button>
      <button id="client-clear">Clear</button>
    </div>
    <div id="client-output" class="output">-</div>
  </div>

  <div class="section">
    <div class="section-title">Node Data</div>
    <div class="section-desc">Stored on layers, saved with file (5 KB per node)</div>

    <div class="row">
      <button id="create-shape">Create Sample Shape</button>
    </div>
    <div class="row">
      <input type="text" id="node-key" placeholder="Key">
      <input type="text" id="node-value" placeholder="Value">
    </div>
    <div class="row">
      <button id="node-save">Save to Layer</button>
      <button id="node-load">Load</button>
      <button id="node-list">List Keys</button>
    </div>
    <div id="node-output" class="output">Create a shape first, then store data on it</div>
  </div>

  <script>
    const clientOutput = document.getElementById('client-output');
    const nodeOutput = document.getElementById('node-output');

    // Client storage actions
    document.getElementById('client-save').addEventListener('click', () => {
      const key = document.getElementById('client-key').value;
      const value = document.getElementById('client-value').value;
      if (key && value) {
        parent.postMessage({ pluginMessage: { type: 'client-save', key, value } }, '*');
      }
    });

    document.getElementById('client-load').addEventListener('click', () => {
      const key = document.getElementById('client-key').value;
      if (key) {
        parent.postMessage({ pluginMessage: { type: 'client-load', key } }, '*');
      }
    });

    document.getElementById('client-list').addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'client-list' } }, '*');
    });

    document.getElementById('client-clear').addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'client-clear' } }, '*');
    });

    // Node data actions
    document.getElementById('create-shape').addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'create-sample-shape' } }, '*');
    });

    document.getElementById('node-save').addEventListener('click', () => {
      const key = document.getElementById('node-key').value;
      const value = document.getElementById('node-value').value;
      if (key && value) {
        parent.postMessage({ pluginMessage: { type: 'node-save', key, value } }, '*');
      }
    });

    document.getElementById('node-load').addEventListener('click', () => {
      const key = document.getElementById('node-key').value;
      if (key) {
        parent.postMessage({ pluginMessage: { type: 'node-load', key } }, '*');
      }
    });

    document.getElementById('node-list').addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'node-list' } }, '*');
    });

    // Listen for messages from the plugin
    window.addEventListener('message', (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      switch (msg.type) {
        case 'client-saved':
        case 'client-cleared':
          clientOutput.textContent = msg.message;
          break;
        case 'client-loaded':
          clientOutput.textContent = `${msg.key}: ${msg.value}`;
          break;
        case 'client-keys':
          clientOutput.textContent = msg.keys.length > 0 ? msg.keys.join(', ') : '(empty)';
          break;
        case 'node-saved':
        case 'shape-created':
          nodeOutput.textContent = msg.message;
          break;
        case 'node-loaded':
          nodeOutput.textContent = `${msg.key}: ${msg.value}`;
          break;
        case 'node-keys':
          nodeOutput.textContent = msg.keys.length > 0 ? msg.keys.join(', ') : '(empty)';
          break;
        case 'error':
          nodeOutput.textContent = msg.message;
          break;
      }
    });
  </script>
</body>
</html>
