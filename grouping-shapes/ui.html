<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 1rem;
      margin: 0;
      background: #1e1e1e;
      color: #fff;
    }

    h3 {
      margin: 0 0 0.5rem 0;
      font-size: 1.125rem;
      font-weight: 600;
      color: #00C1A2;
    }

    p {
      margin: 0 0 1rem 0;
      font-size: 0.8125rem;
      color: #888;
    }

    button {
      background: #f5f5f5;
      color: #1e1e1e;
      border: none;
      padding: 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      background: #e8e8e8;
    }

    .status {
      margin-top: 1rem;
      padding: 0.75rem;
      background: #2a2a2a;
      border-radius: 0.5rem;
      font-size: 0.8125rem;
      color: #888;
    }
  </style>
</head>
<body>
  <h3>Grouping Shapes</h3>
  <p>Groups let you animate multiple shapes together. Shapes outside the group are unaffected.</p>

  <button id="create">Create layer with groups and shapes</button>

  <div id="status" class="status">
    Click to create a container with grouped shapes
  </div>

  <script>
    const status = document.getElementById('status');

    document.getElementById('create').addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'create' } }, '*');
    });

    window.addEventListener('message', (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'success') {
        status.textContent = msg.message;
      } else if (msg.type === 'error') {
        status.textContent = msg.message;
      }
    });
  </script>
</body>
</html>
