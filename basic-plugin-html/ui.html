<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      margin: 0;
      background: #1e1e1e;
      color: #fff;
    }

    h3 {
      margin: 0 0 8px 0;
      font-size: 18px;
      font-weight: 600;
      color: #00C1A2;
    }

    p {
      margin: 0 0 16px 0;
      font-size: 13px;
      color: #888;
    }

    button {
      background: #f5f5f5;
      color: #1e1e1e;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      background: #e8e8e8;
    }
  </style>
</head>
<body>
  <h3>Basic Plugin</h3>
  <p>Click the button to create a rectangle in the scene.</p>
  <button id="create-btn">Create Rectangle</button>

  <script>
    document.getElementById('create-btn').addEventListener('click', () => {
      // Send a message to the plugin code
      parent.postMessage({ pluginMessage: { type: 'create-rectangle' } }, '*');
    });
  </script>
</body>
</html>
