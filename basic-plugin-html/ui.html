<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      margin: 0;
      background: #1e1e1e;
      color: #fff;
    }

    h3 {
      margin: 0 0 16px 0;
      font-size: 16px;
      font-weight: 600;
    }

    p {
      margin: 0 0 16px 0;
      font-size: 13px;
      color: #999;
      line-height: 1.5;
    }

    button {
      background: #0066ff;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      background: #0052cc;
    }

    button:active {
      background: #004099;
    }
  </style>
</head>
<body>
  <h3>Basic Plugin</h3>
  <p>Click the button to create a rectangle in the scene.</p>
  <button id="create-btn">Create Rectangle</button>

  <script>
    document.getElementById('create-btn').addEventListener('click', () => {
      // Send a message to the plugin code
      parent.postMessage({ pluginMessage: { type: 'create-rectangle' } }, '*');
    });
  </script>
</body>
</html>
