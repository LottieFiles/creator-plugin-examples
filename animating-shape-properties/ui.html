<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      margin: 0;
      background: #1e1e1e;
      color: #fff;
    }

    h3 {
      margin: 0 0 8px 0;
      font-size: 16px;
      font-weight: 600;
    }

    p {
      margin: 0 0 16px 0;
      font-size: 13px;
      color: #999;
      line-height: 1.5;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    button {
      background: #333;
      color: white;
      border: 1px solid #444;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      text-align: left;
    }

    button:hover {
      background: #444;
      border-color: #555;
    }

    .description {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h3>Animating Shape Properties</h3>
  <p>Animate shape-specific properties like size, roundness, and points.</p>

  <div class="buttons">
    <button id="rect-size">
      Rectangle Size
      <div class="description">Animate width and height</div>
    </button>

    <button id="rect-roundness">
      Rectangle Roundness
      <div class="description">Sharp corners to rounded</div>
    </button>

    <button id="ellipse-size">
      Ellipse Size
      <div class="description">Circle to wide ellipse</div>
    </button>

    <button id="polygon-points">
      Polygon Points
      <div class="description">Triangle to octagon</div>
    </button>

    <button id="star-radius">
      Star Inner Radius
      <div class="description">Pulsing star effect</div>
    </button>
  </div>

  <script>
    const actions = {
      'rect-size': 'animate-rect-size',
      'rect-roundness': 'animate-rect-roundness',
      'ellipse-size': 'animate-ellipse-size',
      'polygon-points': 'animate-polygon-points',
      'star-radius': 'animate-star-radius'
    };

    Object.entries(actions).forEach(([id, type]) => {
      document.getElementById(id).addEventListener('click', () => {
        parent.postMessage({ pluginMessage: { type } }, '*');
      });
    });
  </script>
</body>
</html>
