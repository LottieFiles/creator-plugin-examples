<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      margin: 0;
      background: #1e1e1e;
      color: #fff;
    }

    h3 {
      margin: 0 0 8px 0;
      font-size: 18px;
      font-weight: 600;
      color: #00C1A2;
    }

    p {
      margin: 0 0 16px 0;
      font-size: 13px;
      color: #888;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      background: #f5f5f5;
      color: #1e1e1e;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
    }

    button:hover {
      background: #e8e8e8;
    }

    button .description {
      font-size: 12px;
      color: #666;
      font-weight: 400;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h3>Animating Shape Properties</h3>
  <p>Animate shape-specific properties like size, roundness, and points.</p>

  <div class="buttons">
    <button id="rect-size">
      Rectangle size
      <div class="description">Animate width and height</div>
    </button>

    <button id="rect-roundness">
      Rectangle roundness
      <div class="description">Sharp corners to rounded</div>
    </button>

    <button id="ellipse-size">
      Ellipse size
      <div class="description">Circle to wide ellipse</div>
    </button>

    <button id="polygon-points">
      Polygon points
      <div class="description">Triangle to octagon</div>
    </button>

    <button id="star-radius">
      Star inner radius
      <div class="description">Pulsing star effect</div>
    </button>
  </div>

  <script>
    const actions = {
      'rect-size': 'animate-rect-size',
      'rect-roundness': 'animate-rect-roundness',
      'ellipse-size': 'animate-ellipse-size',
      'polygon-points': 'animate-polygon-points',
      'star-radius': 'animate-star-radius'
    };

    Object.entries(actions).forEach(([id, type]) => {
      document.getElementById(id).addEventListener('click', () => {
        parent.postMessage({ pluginMessage: { type } }, '*');
      });
    });
  </script>
</body>
</html>
